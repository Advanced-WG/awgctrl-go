name: Linux Test

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'


# LIB-07: the token can only read, and the actions are pinned by commit
# (the tag in the comment).
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        go-version: ["1.26"]
    runs-on: ubuntu-latest

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ matrix.go-version }}
      id: go

    # An existing device for TestLinuxClientIsPermission: reading it without
    # CAP_NET_ADMIN must fail with permission denied (tests run unprivileged).
    # Only where the job runs on a virtual machine: a container job (Gitea
    # Actions) cannot create network devices, and the test skips itself there.
    - name: Create a WireGuard device
      if: github.server_url == 'https://github.com'
      run: sudo ip link add wgperm0 type wireguard

    - name: Run tests
      run: go test -race ./...
