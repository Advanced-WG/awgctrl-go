name: Linux Integration Test

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    strategy:
      matrix:
        go-version: ["1.24"]
    runs-on: ubuntu-latest

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
      id: go

    - name: Install WireGuard tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y wireguard-tools wireguard-go

    - name: Set up integration test WireGuard interfaces
      run: |
        chmod +x .cibuild.sh
        sudo ./.cibuild.sh

    - name: Start wireguard-go userspace device
      run: sudo wireguard-go wguser0

    - name: Build integration test binary
      run: go test -c -race -o /tmp/wgctrl.test .

    - name: Run integration tests
      run: sudo WGCTRL_INTEGRATION=yesreallydoit /tmp/wgctrl.test -test.v -test.run TestIntegration
