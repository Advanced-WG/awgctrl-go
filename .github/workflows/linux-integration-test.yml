name: Linux Integration Test

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'


# LIB-07: the token can only read, and the actions are pinned by commit
# (the tag in the comment).
permissions:
  contents: read

jobs:
  build:
    # Needs kernel WireGuard devices and a TUN device: a virtual machine, not
    # the container a Gitea Actions job runs in.
    if: github.server_url == 'https://github.com'
    strategy:
      matrix:
        go-version: ["1.26"]
    runs-on: ubuntu-latest

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ matrix.go-version }}
      id: go

    - name: Install WireGuard tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y wireguard-tools wireguard-go

    - name: Set up integration test WireGuard interfaces
      run: |
        chmod +x .cibuild.sh
        sudo ./.cibuild.sh

    - name: Start wireguard-go userspace device
      run: sudo wireguard-go wguser0

    - name: Build integration test binary
      run: go test -c -race -o /tmp/wgctrl.test .

    - name: Run integration tests
      run: sudo WGCTRL_INTEGRATION=yesreallydoit /tmp/wgctrl.test -test.v -test.run TestIntegration
